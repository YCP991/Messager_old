server:
  port: 8081  # 使用不同端口避免冲突

spring:
  application:
    name: maisizhe-backend-test
  
  main:
    allow-circular-references: true
  
  # 排除不需要的自动配置
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  
  # 测试数据源配置(使用H2内存数据库)
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: 
  
  # H2控制台(可选)
  h2:
    console:
      enabled: true

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: TestSecretKeyForJWTTokenGenerationAndValidation2024
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

# AI配置(测试环境使用Mock)
ai:
  api:
    key: mock-test-key
    url: https://api.mock-test.com/v1/chat
  deepseek:
    api-key: mock-deepseek-key
    base-url: https://api.deepseek.com/v1
  qwen:
    api-key: mock-qwen-key
    base-url: https://dashscope.aliyuncs.com/api/v1

# 文件上传配置
file:
  upload-path: ./test-uploads
  max-size: 10485760

# 日志配置
logging:
  level:
    com.maisizhe: DEBUG
    org.springframework.security: WARN
    org.springframework.test: INFO